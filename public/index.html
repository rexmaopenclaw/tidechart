<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>水流預報</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Header (removed to save space) -->
    <header>
      <div class="header-row">
        <p class="subtitle">Current Forecast</p>
        <button id="loginBtn" class="login-btn">登入</button>
        <button id="logoutBtn" class="login-btn hidden">登出</button>
      </div>
    </header>

    <!-- Date/Time Picker -->
    <div class="picker">
      <input type="date" id="datePicker">
      <select id="hourPicker" class="time-select"></select>
      <span class="time-colon">:</span>
      <select id="minPicker" class="time-select">
        <option value="00">00</option>
        <option value="15">15</option>
        <option value="30">30</option>
        <option value="45">45</option>
      </select>
      <button id="modeBtn" class="mode-btn">水面</button>
      <button id="refreshBtn">⟳</button>
    </div>

    <!-- Saved Points -->
    <div class="points-bar" id="pointsBar">
      <span class="bar-label">📍 監測點</span>
      <div class="points-list" id="pointsList"></div>
      <button id="addPointBtn" class="add-btn">+</button>
    </div>

    <!-- Cards Row: HKO Wind + Current side by side -->
    <div class="cards-row">
      <!-- HKO Real-time Wind Card (nearest station) -->
      <div class="wind-card" id="windCard">
        <div class="wind-header">
          <span>🌬️ 天文台 <span style="font-size:10px;color:#4a6a8a;">最近風站</span></span>
          <span class="wind-toggle" id="windUnitToggle">km/h</span>
        </div>
        <div class="wind-body" id="windBody">
          <select id="windStationSelect" class="wind-station-select">
            <option value="">載入中...</option>
          </select>
          <div class="hko-wind-main">
            <div class="hko-wind-speed">
              <span class="hko-speed-val" id="windHkoSpeed">--</span>
              <span class="hko-speed-unit" id="windHkoUnit">km/h</span>
            </div>
          </div>
          <div class="hko-wind-details">
            <div class="hko-wind-row">
              <span class="hko-label">陣風</span>
              <span class="hko-value" id="windHkoGust">--</span>
            </div>
            <div class="hko-wind-row dir-row-full">
              <span class="hko-label">風向</span>
              <span class="dir-hko-wrap">
                <span class="dir-arrow-hko" id="windHkoDirArrow">↑</span>
                <span class="hko-value" id="windHkoDir">--</span>
              </span>
            </div>
            <div class="hko-wind-row">
              <span class="hko-label">站點</span>
              <span class="hko-value" id="windHkoStation">--</span>
            </div>
            <div class="hko-wind-row">
              <span class="hko-label">距離</span>
              <span class="hko-value" id="windHkoDist">--</span>
            </div>
            <div class="hko-wind-row">
              <span class="hko-label">更新</span>
              <span class="hko-value" id="windHkoTime">--</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Current Data -->
      <div class="current-card" id="currentCard">
        <div class="loading" id="loading">選擇一個點...</div>
        <div id="content" class="hidden">
          <div class="pname" id="pointName"></div>
          <div class="coords" id="coords"></div>
          <div class="speed-row">
            <span class="speed-val" id="speedVal">--</span>
            <span class="speed-unit">knots</span>
          </div>
          <div class="dir-row" id="dirRow">
            <span class="dir-arrow" id="dirArrow">↑</span>
            <span class="dir-text" id="dirText">--</span>
          </div>
          <div class="strength-bar">
            <div class="bar-fill" id="barFill"></div>
          </div>
          <div class="hydro-point" id="hydroPoint"></div>
        </div>
      </div>
    </div>

    <!-- HKO Wind History Card (collected via cron) -->
    <div class="forecast-wind-card" id="windHistoryCard">
      <div class="wind-header">
        <span>📈 天文台 過去風速 <span style="font-size:10px;color:#4a6a8a;" id="windHistInfo">--</span></span>
        <span class="wind-toggle" id="windHistRange">24h</span>
      </div>
      <div class="tide-chart" id="windHistChart">
        <canvas id="windHistCanvas"></canvas>
      </div>
      <div class="wind-history-note" id="windHistNote" style="font-size:10px;color:#4a6a8a;padding:2px 0 0;">收集數據中...</div>
    </div>

    <!-- Forecast Wind Card (GFS + ECMWF) — reference only -->
    <div class="forecast-wind-card" id="forecastWindCard">
      <div class="wind-header">
        <span>📡 預報風 (參考)</span>
      </div>
      <div class="forecast-wind-body hidden" id="forecastWindBody">
        <div class="wind-row">
          <span class="wind-model brand-gfs">GFS</span>
          <span class="wind-data" id="windGfs">--</span>
        </div>
        <div class="wind-row">
          <span class="wind-model brand-ecmwf">ECMWF</span>
          <span class="wind-data" id="windEcmwf">--</span>
        </div>
      </div>
    </div>

    <!-- Map -->
    <div class="map-wrapper" id="mapWrapper">
      <div id="map"></div>
    </div>

    <!-- Tide Chart (nearest HKO station) -->
    <div class="tide-wrapper">
      <div class="tide-header">
        <span>🌊 潮汐 <span id="tideSummary">--</span> <span class="tide-source" id="tideStation">載入中...</span></span>
      </div>
      <div class="tide-chart" id="tideChart">
        <canvas id="tideCanvas"></canvas>
      </div>
      <div class="tide-info hidden" id="tideInfo">
        <div class="tide-row">
          <span class="label">範圍</span>
          <span id="tideRange">--</span>
        </div>
        <div class="tide-row">
          <span class="label">高低潮</span>
          <span id="tideEvents">--</span>
        </div>
      </div>
    </div>

    <!-- Current Speed 24h Chart -->
    <div class="tide-wrapper">
      <div class="tide-header">
        <span>⏱ 24h 水流速度 <span id="currentSummary">--</span></span>
        <span class="tide-toggle" id="speedToggleBtn">▼ 詳情</span>
      </div>
      <div class="tide-chart" id="speedChart">
        <canvas id="speedCanvas"></canvas>
      </div>
      <div class="tide-info hidden" id="speedInfo">
        <div class="tide-row">
          <span class="label">最快</span>
          <span id="currentMax">--</span>
        </div>
        <div class="tide-row">
          <span class="label">最慢</span>
          <span id="currentMin">--</span>
        </div>
        <div class="tide-row">
          <span class="label">預測點 ID</span>
          <span id="currentPointId">--</span>
        </div>
      </div>
    </div>

    <footer>
      <p>數據：海事處潮汐水流預測 + 天文台潮汐</p>
    </footer>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay hidden" id="loginModal">
    <div class="modal">
      <h3>🔐 登入 / 註冊</h3>
      <div id="loginError" class="login-error hidden"></div>
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com">
      <label>密碼</label>
      <input type="password" id="loginPassword" placeholder="密碼 (最少4位)">
      <div class="modal-btns">
        <button class="cancel" id="loginCancel">取消</button>
        <button class="save" id="loginRegisterBtn">註冊</button>
        <button class="save" id="loginSubmitBtn">登入</button>
      </div>
      <hr style="border-color:#2a3a50;margin:10px 0;">
      <button class="danger-btn hidden" id="deleteAccountBtn">🗑️ 註銷帳號</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
